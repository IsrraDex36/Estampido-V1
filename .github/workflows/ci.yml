name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint · types · tests · e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      # Recent static FFmpeg with libwebp/libwebp_anim, libopus, libx264 and the
      # animated-WebP decoder the tests rely on (distro ffmpeg is too old).
      - name: "Install FFmpeg (recent build with animated WebP decoder, libwebp, libopus)"
        run: |
          curl -fsSL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz -o /tmp/ffmpeg.tar.xz
          sudo mkdir -p /opt/ffmpeg
          sudo tar -xJf /tmp/ffmpeg.tar.xz -C /opt/ffmpeg --strip-components=1
          /opt/ffmpeg/bin/ffmpeg -hide_banner -version | head -1
          /opt/ffmpeg/bin/ffmpeg -hide_banner -encoders | grep -E "libwebp_anim|libopus"
          echo "FFMPEG_PATH=/opt/ffmpeg/bin/ffmpeg" >> "$GITHUB_ENV"
          echo "FFPROBE_PATH=/opt/ffmpeg/bin/ffprobe" >> "$GITHUB_ENV"

      - name: Install webpmux (optional cross-check in tests)
        run: sudo apt-get update && sudo apt-get install -y webp

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix web

      - run: npm run check-deps
      - name: Lint (API/core + web)
        run: |
          npm run lint
          npm --prefix web run lint
      - run: npm run typecheck
      - name: Unit + integration tests
        run: npm test
      - name: Build web
        run: npm --prefix web run build
      - name: Browser end-to-end tests
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npx vitest run --config vitest.e2e.config.ts

  docker:
    name: Docker image (Railway) · build + smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build -t estampido:ci .

      - name: Run (no bot) and wait for health
        run: |
          docker run -d --name est -p 8787:8787 estampido:ci npx tsx scripts/start.ts --skip-build --no-bot
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8787/api/health && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8787/api/health

      - name: Smoke test (web, SPA fallback, headers, API JSON, ffmpeg)
        run: |
          set -e
          curl -fsS http://127.0.0.1:8787/ | grep -q '<div id="root">'
          curl -fsS http://127.0.0.1:8787/comunidad | grep -q '<div id="root">'
          curl -fsS http://127.0.0.1:8787/ | grep -q 'rel="canonical"'
          curl -fsS http://127.0.0.1:8787/robots.txt | grep -q 'Sitemap:'
          curl -fsS http://127.0.0.1:8787/sitemap.xml | grep -q '<urlset'
          curl -fsSI http://127.0.0.1:8787/favicon.ico | grep -qi 'image/x-icon'
          curl -fsSI http://127.0.0.1:8787/ | grep -qi 'content-security-policy'
          curl -fsSI http://127.0.0.1:8787/ | grep -qi 'x-frame-options: DENY'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/api/nope)" = "404"
          curl -fsS http://127.0.0.1:8787/api/community/stats | grep -q '"stickers"'
          docker exec est /opt/ffmpeg/bin/ffmpeg -hide_banner -encoders | grep -q libwebp_anim
          docker exec est sh -c 'test -d /data && echo volume dir ok'

      - name: Logs
        if: always()
        run: docker logs est || true
