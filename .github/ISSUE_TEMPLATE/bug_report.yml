name: 🐞 Reporte de error
description: Algo no funciona como debería
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ¡Gracias por avisar! Para problemas de **seguridad**, no uses este formulario: sigue [SECURITY.md](https://github.com/IsrraDex36/Estampido-V1/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: ¿Qué pasó?
      description: Describe el error y qué esperabas que pasara.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Subí un video de 20 s
        2. En Sonido elegí «Grabar»
        3. …
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: ¿Dónde?
      multiple: true
      options:
        - Web (editor)
        - Web (resultado / envío a WhatsApp)
        - Web (comunidad)
        - Bot de WhatsApp
        - CLI / API
        - Despliegue (Docker, Railway…)
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Dispositivo y navegador
      placeholder: "iPhone 15, Safari 26 · Android, Chrome · macOS, Brave"
  - type: textarea
    id: extra
    attributes:
      label: Capturas o registros
      description: Arrastra capturas o pega mensajes de error. **No incluyas** números de teléfono, tokens ni archivos de `.auth/`.
